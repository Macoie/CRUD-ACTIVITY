<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product CRUD Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Product CRUD Form</h1>
    <p class="subtitle">Manage product records using asynchronous API requests.</p>

    <section class="card">
      <form id="productForm">
        <input type="hidden" id="productId" />
        <label for="title">Product name</label>
        <input id="title" type="text" required placeholder="Enter product name" />
        <label for="price">Price</label>
        <input id="price" type="number" min="0" step="0.01" required placeholder="Enter price" />
        <label for="category">Category</label>
        <input id="category" type="text" required placeholder="Enter category" />
        <div class="buttons">
          <button type="submit" id="saveButton">Add Product</button>
          <button type="button" id="cancelButton" class="secondary hidden">Cancel Edit</button>
        </div>
      </form>
    </section>

    <p id="status" class="status" aria-live="polite"></p>
    <section class="card">
      <div class="list-heading">
        <h2>Product Records</h2>
        <button id="refreshButton" class="secondary">Refresh</button>
      </div>
      <div id="productList" class="product-list"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
